# 着丼クエストの紹介ページ（public/）と API（functions/、/api/v1/...）。Cloudflare Pages の1つのプロジェクト。
# 設計は issue #172。公開先は https://ramen-in-cho.aiandrox.com
name = "ramen-in-cho"
compatibility_date = "2025-01-01"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "ramen-in-cho"
database_id = "472bcba3-2644-41d8-b16a-1474a517654b"
migrations_dir = "migrations"

[vars]
# "true" にすると、Firebase App Check のトークンが無い・正しくない問い合わせを断る（それまでは記録だけ）。
APP_CHECK_ENFORCE = "true"
