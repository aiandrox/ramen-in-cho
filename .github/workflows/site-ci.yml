name: Site CI

# 紹介ページと API（site/、Cloudflare Pages）と、店の正本（data/）の確認。設計は issue #172。
on:
  pull_request:
    paths:
      - "site/**"
      - "data/**"
      # サーバーの検索のテストは、アプリと同じ保存した応答（test/fixtures）を使う。
      - "test/fixtures/**"
      - ".github/workflows/site-ci.yml"
      # 紹介ページの書体と絵の元（scripts/lp_fonts.py・scripts/lp_images.py）
      - "assets/fonts/**"
      - "docs/seals/catalog.png"
      - "docs/buttons/*.png"
      - "docs/hiden/*.png"
      - "ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # ubuntu-latest が 2026-10-19 から Ubuntu 26 に変わっても急に壊れないよう、版を固定する（#285）
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # 正本から D1 に入れる SQL を作れるか（デプロイと同じ道筋）。
      - run: npm run seed
      # 紹介ページに、間引いた書体に無い字が入っていないか。絵が元の見本から作ったものと同じか（site/README.md）。
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: site/scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - run: python3 scripts/lp_fonts.py check
      - run: python3 scripts/lp_images.py check
