name: Native Build Check

# ネイティブビルドの疎通確認。単体テストだけではCocoaPods統合設定の欠落等
# ネイティブ側だけで起きる不具合を検知できないため追加する。
# 署名は行わず（Android: デバッグ署名、iOS: --no-codesign）ビルドの成否のみ見る。
#
# 頻度を抑えるため、Androidはネイティブビルドに影響しうる変更をmainへマージした時のみ、
# iOSは手動実行（workflow_dispatch）時のみ走らせる。

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/native-build-check.yml"
      - ".github/actions/setup-flutter/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    # ubuntu-latest が 2026-10-19 から Ubuntu 26 に変わっても急に壊れないよう、版を固定する（#285）
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-flutter

      - run: flutter pub get

      - run: flutter build apk --debug

  # macOSランナーはLinuxの10倍の分数を消費し、Actions全体の消費の大半を占めていたため
  # 手動実行時のみにする。
  ios-build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-flutter

      - uses: actions/cache@v6
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-cocoapods-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-cocoapods-

      - run: flutter pub get

      - run: flutter build ios --debug --no-codesign
