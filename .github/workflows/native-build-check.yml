name: Native Build Check

# ネイティブビルドの疎通確認。単体テストだけではCocoaPods統合設定の欠落等
# ネイティブ側だけで起きる不具合を検知できないため追加する。
# 署名は行わず（Android: デバッグ署名、iOS: --no-codesign）ビルドの成否のみ見る。
#
# Androidはネイティブビルドに影響しうる変更をmainへマージした時、
# iOSはiOSに影響しうる変更のPRで走らせる（どちらも手動実行でも走る）。

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/native-build-check.yml"
      - ".github/actions/setup-flutter/**"
  pull_request:
    paths:
      - "ios/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/native-build-check.yml"
      - ".github/actions/setup-flutter/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    if: github.event_name != 'pull_request'
    # ubuntu-latest が 2026-10-19 から Ubuntu 26 に変わっても急に壊れないよう、版を固定する（#285）
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-flutter

      - run: flutter pub get

      - run: flutter build apk --debug

  # 公開リポジトリでは macOS の標準ランナーも無料（#291）。
  # PRで自動で走るので、macos-latest の切り替わりで急に壊れないよう版を固定する
  ios-build:
    if: github.event_name != 'push'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-flutter

      - uses: actions/cache@v6
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-cocoapods-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-cocoapods-

      - run: flutter pub get

      - run: flutter build ios --debug --no-codesign
