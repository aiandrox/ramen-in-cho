name: Site Health

# サーバー（https://ramen-in-cho.aiandrox.com）の API が止まっていないかを1日1回確かめる（#292）。
# 止まってもアプリは端末から直接探すので気づきにくいため。問い合わせるのはサーバーの API だけで、
# 先の検索サービスは直接は叩かない。失敗したら issue を立てる（開いたままの issue があればそこに書き足す）。
on:
  schedule:
    - cron: "17 0 * * *" # 毎日 9:17（日本時間）
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: site-health
  cancel-in-progress: false

jobs:
  check:
    # ubuntu-latest が 2026-10-19 から Ubuntu 26 に変わっても急に壊れないよう、版を固定する（#285）
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - id: check
        run: |
          set -o pipefail
          .github/scripts/site-health.sh | tee result.txt

      - if: failure() && steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "サーバーの見張り: API が思ったとおりに答えていません"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$(printf '%s\n\n```\n%s\n```\n\n%s\n' "$RUN_URL" "$(cat result.txt)" "直ったらこの issue を閉じてください。開いている間は、同じ失敗をここに書き足します。")"
          number="$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title --jq "map(select(.title == env.TITLE)) | .[0].number // empty")"
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --label 基盤 --body "$body"
          fi
